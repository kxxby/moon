<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Moon · Private access</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101713;color:#e1eee5;font:16px system-ui}main{width:min(430px,90vw);padding:38px;border:1px solid #304a38;border-radius:20px;background:#17231b}small{color:#9dc9aa;letter-spacing:3px}h1{font-weight:500;font-size:32px;margin:18px 0 12px}p{color:#a8b9ad;line-height:1.6}label{display:block;margin-top:28px}input,button{width:100%;font:inherit;padding:13px;border-radius:8px;margin-top:9px}input{background:#101713;border:1px solid #45624e;color:white}button{background:#ade6bf;border:0;color:#14271a;cursor:pointer;margin-top:18px}#error{color:#efb8a9;font-size:14px}button:disabled{opacity:.5}</style></head><body><main><small>MOON / PRIVATE</small><h1>Your market, protected.</h1><p>Enter your password to unlock the dashboard and its encrypted data.</p><form id="unlock"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Unlock Moon</button><p id="error" role="status" aria-live="polite"></p></form></main><script>
const bytes=text=>Uint8Array.from(atob(text),c=>c.charCodeAt(0));
document.getElementById('unlock').onsubmit=async event=>{event.preventDefault();const button=document.getElementById('submit');button.disabled=true;document.getElementById('error').textContent='Unlocking…';try{
const response=await fetch('./app.enc.json',{cache:'no-store'});if(!response.ok)throw Error();const envelope=await response.json();if(envelope.version!==1||envelope.iterations!==600000)throw Error();
const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveBits']);
const raw=await crypto.subtle.deriveBits({name:'PBKDF2',salt:bytes(envelope.salt),iterations:600000,hash:'SHA-256'},material,256);
const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(envelope.iv),additionalData:new TextEncoder().encode('moon-vault-v1:app')},key,bytes(envelope.ciphertext));
const app=JSON.parse(new TextDecoder().decode(plain));const rawText=btoa(String.fromCharCode(...new Uint8Array(raw)));
const html=app.html.replace('<!--MOON_UNLOCK_BOOTSTRAP-->', '<script>('+app.bootstrap+')('+JSON.stringify(rawText)+','+JSON.stringify(app.odds).replace(/</g,'\u003c')+','+JSON.stringify(app.feedUrl)+','+JSON.stringify(app.purchaseFeedUrl||null)+');<\/script>');
document.getElementById('password').value='';document.open();document.write(html);document.close();
}catch{document.getElementById('error').textContent='Unable to unlock. Check your password and connection.';button.disabled=false;}};
</script></body></html>
